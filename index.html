<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<link rel="icon" type="image/png" href="favicon-64.png">

<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>السياگ - SYAG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@600;700;800&family=Noto+Sans+Arabic:wght@400;500;700;800&display=swap">
<style>
/* Layout: compact top bar; throw tray and cactus-pad board side by side so both fit one phone screen; log, rules below */
:root{
  --bg:#E8E9DF; --surface:#F6F6F0; --ink:#1E2318; --muted:#5D6553; --line:#C9CCBC;
  --pad:#6A9450; --pad-deep:#46703A; --hole:#24391C; --spine:rgba(250,248,225,.55);
  --wood:#EADFC4; --wood-grain:#CDBE98; --kahla:#36522B; --kahla-grain:#25391D;
  --date:#6D3A1E; --date-hi:#9A5A34; --fruit:#A6305C; --fruit-soft:#F3DCE5; --ok:#2F6B3A;
  --display:"Noto Kufi Arabic","Noto Sans Arabic",system-ui,sans-serif;
  --body:"Noto Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15180F; --surface:#1E2217; --ink:#E9EBDF; --muted:#A1A895; --line:#353B2C;
  --pad:#4F7A3C; --pad-deep:#33552A; --hole:#132010; --spine:rgba(230,240,200,.35);
  --wood:#E3D6B6; --wood-grain:#BFAE86; --kahla:#3E5E31; --kahla-grain:#203219;
  --date:#7A4323; --date-hi:#A8653B; --fruit:#E0628F; --fruit-soft:#3A1C28; --ok:#7CC48A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15180F; --surface:#1E2217; --ink:#E9EBDF; --muted:#A1A895; --line:#353B2C;
  --pad:#4F7A3C; --pad-deep:#33552A; --hole:#132010; --spine:rgba(230,240,200,.35);
  --wood:#E3D6B6; --wood-grain:#BFAE86; --kahla:#3E5E31; --kahla-grain:#203219;
  --date:#7A4323; --date-hi:#A8653B; --fruit:#E0628F; --fruit-soft:#3A1C28; --ok:#7CC48A;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.app{max-width:860px;margin:0 auto;padding-block:10px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
button,select,input{font-family:var(--body);font-size:15px}
.btn{border:0;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer}
.btn:focus-visible,select:focus-visible,.cell:focus-visible,.pchip:focus-visible,summary:focus-visible{outline:3px solid var(--fruit);outline-offset:2px}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}

.top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-family:var(--display);font-size:28px;line-height:1;margin:0}
h1 .latin{font-family:var(--body);font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--muted);vertical-align:middle}
.settings summary{list-style:none;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:700;font-size:14px}
.settings summary::-webkit-details-marker{display:none}
.settings[open] summary{background:var(--surface)}
.panel{position:absolute;inset-inline:0;top:calc(100% + 6px);z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;box-shadow:0 12px 30px rgba(0,0,0,.18)}
.panel label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px;flex:1 1 150px}
select,input[type=text]{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:100%}
input[type=text]:focus-visible{outline:3px solid var(--fruit);outline-offset:1px}
.panel .row{display:flex;gap:8px;width:100%;justify-content:flex-end}

.status{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.turn{display:flex;align-items:center;gap:8px;font-weight:700;min-width:0}
.turn small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.token{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--pad-deep)}
.count{font-size:12px;color:var(--muted);text-align:end;font-variant-numeric:tabular-nums;line-height:1.35}

.play{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:stretch}
.tray{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;--sw:20px;--sh:124px;min-width:0}
.sticks{position:relative;height:160px;perspective:700px}
.stick{width:var(--sw);height:var(--sh);position:absolute;left:calc(50% - var(--sw) / 2);top:calc((100% - var(--sh)) / 2);transform-origin:50% 50%;filter:drop-shadow(0 3px 2px rgba(0,0,0,.28))}
.stick svg{width:100%;height:100%;display:block;overflow:visible}
.stick.edge{width:calc(var(--sw) / 3)}
.result{text-align:center;min-height:44px}
.result .name{font-family:var(--display);font-size:22px;line-height:1.15}
.result .meta{font-size:12px;color:var(--muted)}
.result .meta b{color:var(--fruit)}
.salia{color:var(--fruit)}
.pool{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:28px;align-items:center}
.pchip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:2px 9px;font-size:13px;cursor:pointer;display:flex;gap:4px;align-items:baseline}
.pchip b{font-variant-numeric:tabular-nums;color:var(--fruit)}
.pchip.sel{background:var(--fruit);border-color:var(--fruit);color:#fff}
.pchip.sel b{color:#fff}
.pchip:disabled{opacity:.4;cursor:default}
.pchip.idle{cursor:default}
.hint{font-size:12px;color:var(--muted)}
.total{font-size:12px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums;min-height:18px}
.btn-throw{background:var(--fruit);color:#fff;font-size:16px;padding:10px 8px;width:100%;margin-top:auto}
.btn-throw:disabled{opacity:.45;cursor:default}

.boardcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.pad{position:relative;width:100%;padding:12px 8px 16px;border-radius:46% 46% 40% 40% / 10% 10% 8% 8%;
  background:radial-gradient(circle,var(--spine) 1px,transparent 1.6px) 0 0/18px 18px,radial-gradient(ellipse at 40% 30%,var(--pad),var(--pad-deep));
  box-shadow:inset 0 -6px 18px rgba(0,0,0,.18),0 2px 0 var(--line)}
.colnames{direction:ltr;display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center;color:#F4F2E2;font-size:11px;font-weight:700;margin-bottom:4px}
.colnames span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board{--rb:24px;--hb:16px;--pb:.8;--z:1;--zf:1;--row:calc(var(--rb) * var(--z) * var(--zf));--holed:calc(var(--hb) * var(--z) * var(--zf));--ps:calc(var(--pb) * var(--z) * var(--zf));direction:ltr;display:grid;grid-template-columns:1fr 1fr 10px 1fr 1fr;grid-template-rows:repeat(12,var(--row));row-gap:2px}
.cell{position:relative;display:grid;place-items:center;border:0;background:none;padding:0;cursor:default}
.cell::before{content:"";width:var(--holed);height:var(--holed);border-radius:50%;background:var(--hole);box-shadow:inset 0 2px 3px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.15);position:absolute}
.cell.dest::before{box-shadow:0 0 0 3px var(--fruit-soft),inset 0 2px 3px rgba(0,0,0,.55)}
.cell.can{cursor:pointer}
.cell.can::after{content:"";position:absolute;width:calc(var(--holed) + 7px);height:calc(var(--holed) + 7px);border-radius:50%;border:2px solid #fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12);opacity:.5}}
.pc{position:absolute;z-index:1}
.board .pc{scale:var(--ps)}
.pc.k-stick{width:6px;height:22px;border-radius:3px;transform:rotate(-24deg);box-shadow:0 1px 1px rgba(0,0,0,.4)}
.pc.k-stick-wood{background:repeating-linear-gradient(0deg,#EADFC4 0 4px,#CDBE98 4px 5px)}
.pc.k-stick-dark{background:repeating-linear-gradient(0deg,#6E4B2F 0 4px,#4A3220 4px 5px)}
.pc.k-stick-red{background:repeating-linear-gradient(0deg,#C2523A 0 4px,#8E3422 4px 5px)}
.pc.k-date{width:12px;height:20px;border-radius:50%;background:radial-gradient(ellipse at 35% 30%,#A8653B,#6D3A1E);box-shadow:0 1px 1px rgba(0,0,0,.45)}
.pc.k-date::after{content:"";position:absolute;left:50%;top:3px;bottom:3px;width:1px;background:rgba(0,0,0,.45)}
.pc.k-olive{width:10px;height:16px;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;background:repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 35% 30%,#D9B98E,#946B42);box-shadow:0 1px 1px rgba(0,0,0,.4)}
.pc.k-stone{width:14px;height:12px;border-radius:46% 54% 42% 58% / 55% 45% 55% 45%;background:radial-gradient(ellipse at 35% 30%,#D4D0C6,#8A857A);box-shadow:0 1px 2px rgba(0,0,0,.45)}
.pc.second.k-stick{transform:rotate(24deg)}
.pc.second:not(.k-stick){transform:translateX(5px)}
.kpick{flex-basis:100%;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.sw .pv{width:26px;height:26px;border-radius:50%;background:#5E8C45;position:relative;display:grid;place-items:center;flex:none}
.sw .pv .pc{position:relative}
.sw button:disabled{opacity:.4;cursor:default}
.knote{flex-basis:100%;margin:0;font-size:12px;color:var(--muted)}
.board .pc.lift{scale:calc(var(--ps) * 1.4);filter:drop-shadow(0 5px 3px rgba(0,0,0,.5));z-index:3}
.badge{position:absolute;z-index:2;top:-4px;right:0;background:var(--fruit);color:#fff;font-size:9px;font-weight:700;border-radius:8px;padding:0 3px;line-height:13px}
.hit{position:absolute;z-index:6;bottom:calc(100% - 2px);background:var(--fruit);color:#fff;font-size:12px;font-weight:700;padding:1px 7px;border-radius:8px;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.3);animation:hitpop 1.6s ease both}
@keyframes hitpop{0%{transform:translateY(6px) scale(.6);opacity:0}15%{transform:none;opacity:1}85%{opacity:1}100%{opacity:0}}
.zoom{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted)}
.zoom .zb{display:flex;gap:4px}
.zoom button{width:34px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;font-weight:700;line-height:1;cursor:pointer}
.zoom button:disabled{opacity:.4;cursor:default}
.zoom button:focus-visible{outline:3px solid var(--fruit);outline-offset:1px}
.padwrap{overflow-x:auto}
.play.focus{grid-template-columns:minmax(0,1fr)}
.play.focus .sticks,.play.focus .result,.play.focus .btn-throw{display:none}
.play.focus .tray{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:8px}
.play.focus .board{--zf:1.45}
.play.focus .boardcol{width:100%;max-width:560px;margin-inline:auto}
.check{flex-direction:row!important;align-items:center;gap:8px!important;flex-basis:100%!important;color:var(--ink)!important}
.check input{width:18px;height:18px;accent-color:var(--fruit)}
[hidden]{display:none!important}
:root{--ground-trab:#A9825B;--ground-sable:#E2C994}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ground-trab:#6E5036;--ground-sable:#9C8457}}
:root[data-theme="dark"]{--ground-trab:#6E5036;--ground-sable:#9C8457}
:root[data-bg="trab"] .sticks{border-radius:12px;background-color:var(--ground-trab);background-image:radial-gradient(rgba(50,28,10,.35) 1px,transparent 1.7px),radial-gradient(rgba(255,235,200,.18) 1px,transparent 1.8px),radial-gradient(rgba(70,45,20,.25) 2.5px,transparent 3.5px);background-size:7px 7px,11px 11px,23px 19px;background-position:0 0,3px 5px,9px 4px;box-shadow:inset 0 2px 10px rgba(0,0,0,.25)}
:root[data-bg="sable"] .sticks{border-radius:12px;background-color:var(--ground-sable);background-image:radial-gradient(rgba(110,80,30,.22) 1px,transparent 1.5px),radial-gradient(rgba(255,250,235,.35) 1px,transparent 1.6px);background-size:6px 6px,9px 9px;background-position:0 0,2px 4px;box-shadow:inset 0 2px 10px rgba(0,0,0,.15)}
.bgpick{flex-basis:100%;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 12px 4px 4px;font-size:13px;font-weight:700;cursor:pointer;min-height:34px}
.sw button[aria-pressed="true"]{outline:3px solid var(--fruit);outline-offset:1px}
.sw button:focus-visible{outline:3px solid var(--fruit);outline-offset:2px}
.sw i{width:24px;height:24px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.18)}
.pc.fly{position:fixed;z-index:30;pointer-events:none}
.rtag{position:absolute;z-index:6;bottom:calc(100% - 4px);background:var(--ink);color:var(--bg);font-size:11px;font-weight:700;padding:0 6px;border-radius:7px;white-space:nowrap;pointer-events:none}
.cheer .hitmsg{font-size:64px;color:#fff;background:var(--fruit);padding:6px 30px;animation:pop 1.8s ease both}
.resume{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.rbox{background:var(--surface);color:var(--ink);border-radius:16px;padding:20px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:10px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.rbox h2{font-family:var(--display);margin:0;font-size:22px}
.rbox p{margin:0;color:var(--muted)}
.rbtn{display:flex;flex-direction:column;gap:8px}
.quick{display:flex;gap:8px;margin-top:-4px;flex-wrap:wrap;align-items:center}
.langsel{width:auto!important;border-radius:999px!important;padding:4px 10px!important;font-size:13px!important;font-weight:700;background:var(--surface)!important}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:15px;padding:8px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--fruit);color:#fff}
.tabs button:focus-visible{outline:3px solid var(--fruit);outline-offset:2px}
.viewplay{display:flex;flex-direction:column;gap:10px}
.learn{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.ltray{--sw:24px;--sh:150px}
.ltray .sticks{height:190px}
.lres{text-align:center;min-height:70px}
.lres .name{font-family:var(--display);font-size:28px;line-height:1.15}
.lres p{margin:4px 0;font-size:14px;max-width:60ch;margin-inline:auto}
.lres .lt{font-weight:700}
.lres .lstep{font-size:12px;color:var(--muted);margin:0}
.lres .lshape{font-weight:700;color:var(--ink)}
.lres .lt.w{color:var(--ok)}
.lres .lt.l{color:var(--fruit)}
#lSeq .hint{text-align:center;margin:4px 0 0}
.about{grid-column:1/-1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.about h2{font-family:var(--display);font-size:20px;margin:0 0 6px}
.about p{margin:0 0 6px;font-size:14px;line-height:1.6;max-width:70ch}
.steps{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.steps h2{font-family:var(--display);font-size:20px;margin:0 0 6px}
.steps ol{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px;font-size:14px}
@media (min-width:720px){.learn{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.tg{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;cursor:pointer}
.tg .dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.tg[aria-pressed="true"] .dot{background:var(--fruit)}
.tg:focus-visible{outline:3px solid var(--fruit);outline-offset:2px}
.qura{display:flex;flex-direction:column;align-items:center;gap:2px}
.bowl{position:relative;width:76px;min-height:92px;margin-top:24px;border-radius:24px 24px 16px 16px;background:linear-gradient(90deg,rgba(170,205,225,.35),rgba(255,255,255,.7) 35%,rgba(200,225,238,.3) 70%,rgba(150,190,212,.4));border:2px solid rgba(130,170,195,.85);box-shadow:inset 0 -10px 14px rgba(100,150,180,.28),0 4px 8px rgba(0,0,0,.12);display:flex;align-items:flex-end;justify-content:center;padding:8px 6px 10px;animation:bowlIn .5s cubic-bezier(.3,1.4,.6,1) both;transform-origin:50% 100%}
.bowl::before{content:"";position:absolute;top:-25px;left:50%;width:24px;height:24px;margin-left:-12px;border:2px solid rgba(130,170,195,.85);border-bottom:0;border-radius:5px 5px 0 0;background:linear-gradient(90deg,rgba(170,205,225,.35),rgba(255,255,255,.7) 40%,rgba(150,190,212,.35))}
.bowl::after{content:"";position:absolute;top:12px;left:10px;width:7px;height:46px;border-radius:6px;background:rgba(255,255,255,.65);pointer-events:none}
.q-items{display:flex;flex-direction:column-reverse;gap:3px;align-items:center;position:relative;z-index:1}
.q-items span{font-size:11px;font-weight:700;background:var(--fruit);color:#fff;border-radius:999px;padding:0 6px;line-height:17px;animation:drop .5s cubic-bezier(.3,1.4,.6,1) both}
.q-label{font-size:11px;font-weight:700;color:var(--muted)}
.qura.lost .bowl{animation:shake .45s ease,fadeout .8s .5s ease forwards}
.qura.lost .q-label{color:var(--fruit)}
.qura.pour .bowl{animation:pour .9s ease forwards}
@keyframes bowlIn{from{transform:scale(.4);opacity:0}}
@keyframes drop{from{transform:translateY(-34px);opacity:0}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes fadeout{to{opacity:0;transform:scale(.7)}}
@keyframes pour{45%{transform:rotate(-115deg) translateY(-6px)}100%{transform:rotate(-115deg) translateY(-6px);opacity:0}}
@media (prefers-reduced-motion:reduce){.bowl,.q-items span,.qura.lost .bowl,.qura.pour .bowl{animation:none}}
.deadrow{direction:ltr;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dead{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:30px;padding:4px 8px;border:1px dashed var(--line);border-radius:10px}
.dead .n{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.dead .pc{position:relative;scale:.8}

.cheer{position:fixed;inset:0;pointer-events:none;z-index:20;display:grid;place-items:center;overflow:hidden}
.cheer .msg{font-family:var(--display);font-size:34px;background:var(--surface);color:var(--fruit);padding:12px 24px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pop 2.8s ease both}
@keyframes pop{0%{transform:scale(.6);opacity:0}12%{transform:scale(1.06);opacity:1}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.cheer i{position:absolute;top:-16px;width:8px;height:14px;border-radius:2px;animation:fall 2.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(560deg)}}
@media (prefers-reduced-motion:reduce){.cheer i{display:none}.cheer .msg,.hit{animation:none}.cell.can::after{animation:none}}

.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:13px}
.log li{color:var(--muted)}.log li:first-child{color:var(--ink);font-weight:500}
.log .cap{color:var(--fruit)}
.win-banner{background:var(--fruit);color:#fff;border-radius:12px;padding:12px;text-align:center;font-family:var(--display);font-size:22px}
details.rules{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details.rules summary{cursor:pointer;font-weight:700}
details.rules ul{padding-inline-start:20px;margin:8px 0 0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{display:flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 8px 3px 6px;color:var(--muted)}
.chip.win{border-color:var(--fruit);color:var(--ink)}
.mini{display:flex;gap:2px}.mini i{width:4px;height:12px;border-radius:2px;display:block}
.mini i.w{background:var(--wood);box-shadow:inset 0 0 0 1px var(--wood-grain)}.mini i.k{background:var(--kahla)}

@media (min-width:720px){
  .tray{--sw:28px;--sh:180px;padding:12px}
  .sticks{height:230px}
  .result .name{font-size:28px}
  .board{--rb:31px;--hb:21px;--pb:1}
  .pad{padding:18px 14px 22px}
}

.learn .about,.learn .steps,.learn .ltray{background:color-mix(in srgb,var(--surface) 90%,transparent)}
@supports not (background:color-mix(in srgb,red 50%,transparent)){.learn .about,.learn .steps,.learn .ltray{background:var(--surface);opacity:.94}}

.about p,.steps ol,details.rules ul{font-size:16.5px!important;line-height:1.85!important;color:var(--ink)!important;font-weight:500}
.about p{margin-bottom:10px!important}
.steps ol,details.rules ul{gap:10px!important}
.about h2,.steps h2{font-size:24px!important}
.steps b,details.rules b{font-weight:800;color:var(--fruit)}
details.rules summary{font-size:17px}
.lres p{font-size:16px!important;line-height:1.75!important;color:var(--ink)}
.lres .lstep{color:var(--muted)!important}

/* larger, higher-contrast text in the play view */
.turn{font-size:18px}
.turn small{font-size:14px!important;color:var(--ink)!important;opacity:.8}
.count{font-size:14px!important;color:var(--ink)!important;line-height:1.5!important}
.result .name{font-size:32px!important}
.result .meta{font-size:15px!important;color:var(--ink)!important;font-weight:600}
.pchip{font-size:16px!important;padding:5px 12px!important;font-weight:700}
.total{font-size:15px!important;color:var(--ink)!important;font-weight:600}
.hint{font-size:14px!important;color:var(--ink)!important;opacity:.75}
.btn-throw{font-size:19px!important;padding:12px 10px!important}
.log{font-size:15px!important;gap:4px!important}
.log li{color:var(--ink)!important;opacity:.75}
.log li:first-child{opacity:1;font-weight:700}
.log .cap{color:var(--fruit)!important;opacity:1}
.dead .n{font-size:14px!important;color:var(--ink)!important}
.colnames{font-size:13px!important}
.zoom{font-size:14px!important;color:var(--ink)!important}
.q-label{font-size:13px!important}
.hit{font-size:14px!important}
.tabs button{font-size:17px!important}
.tg{font-size:14px!important}
.settings summary{font-size:15px!important}
.panel label,.kpick,.bgpick{font-size:15px!important;color:var(--ink)!important}
.knote{font-size:13px!important;color:var(--ink)!important;opacity:.75}
@media (min-width:720px){.result .name{font-size:36px!important}}
.status{flex-wrap:wrap;row-gap:4px}
.turn{flex:1 1 100%}
.turn #turnName{white-space:nowrap}
.count{flex:1 1 100%;text-align:start!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid var(--line);padding-top:4px}
@media (min-width:720px){.turn,.count{flex:0 1 auto}.count{border-top:0;padding-top:0;text-align:end!important}}

.win-banner{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 14px!important}
.win-banner .wt{font-family:var(--display);font-size:30px;line-height:1.2}
.win-banner .ws,.win-banner .wsc{font-family:var(--body);font-size:16px;font-weight:600;opacity:.95}
.win-banner .win-again{margin-top:6px;background:#fff;color:var(--fruit);font-size:18px;padding:10px 22px}
.cheer .toastmsg{font-size:24px;padding:10px 22px;animation:pop 1.7s ease both}
#newGame.warn{border-color:var(--fruit);color:var(--fruit)}

.share{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.share .sh{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:8px 14px;border-radius:999px;border:2px solid rgba(255,255,255,.85);background:transparent;color:#fff;font-family:var(--body);font-size:15px;font-weight:700;text-decoration:none;cursor:pointer}
.share .sh-main{background:#fff;color:var(--fruit);border-color:#fff}
.share .sh:focus-visible{outline:3px solid #fff;outline-offset:2px}
.sh-hint{margin:6px 0 0;font-family:var(--body);font-size:13px;opacity:.85;text-align:center}

.phx{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(10,14,8,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:phxIn .35s ease-out both;cursor:pointer;overflow:hidden}
.phx.out{animation:phxOut .4s ease-in both}
.phx .cap{font-family:var(--display);font-weight:800;font-size:clamp(28px,8vw,52px);color:#fff;text-shadow:0 3px 14px rgba(0,0,0,.5);animation:capIn .6s .25s cubic-bezier(.2,1.6,.4,1) both}
.phx svg.ph{width:min(46vw,240px);height:auto;overflow:visible;filter:drop-shadow(0 18px 24px rgba(0,0,0,.45))}
.phx.win svg.ph{animation:phDance 1s ease-in-out infinite}
.phx.win .armL{transform-origin:36px 120px;animation:waveL .5s ease-in-out infinite alternate}
.phx.win .armR{transform-origin:164px 120px;animation:waveR .5s ease-in-out infinite alternate}
.phx.win .crown{animation:crownIn .7s .3s cubic-bezier(.2,1.7,.4,1) both}
.phx.win .shades{animation:shadesIn .5s .6s cubic-bezier(.3,1.5,.5,1) both}
.phx.win .mouth{animation:laugh .25s ease-in-out infinite alternate;transform-origin:100px 168px}
.phx.lose svg.ph{animation:phSlump 7s ease-in-out both}
.phx.lose .screen{animation:dim 3s ease-in both}
.phx.lose .tear{animation:tear 1.3s ease-in infinite}
.phx.lose .tear.t2{animation-delay:.65s}
.phx.lose .crack{stroke-dasharray:160;stroke-dashoffset:160;animation:crack .5s 3.2s ease-out forwards}
.phx.lose .armL{transform-origin:36px 120px;transform:rotate(-25deg)}
.phx.lose .armR{transform-origin:164px 120px;transform:rotate(25deg)}
.phx .cloud{position:absolute;top:8%;font-size:0;width:min(50vw,260px);animation:cloudIn 1s .4s ease-out both}
.phx .drop{position:absolute;top:-20px;width:3px;height:16px;border-radius:2px;background:#9fc3e6;opacity:.8;animation:rain 1s linear infinite}
.phx .conf{position:absolute;top:-24px;width:10px;height:16px;border-radius:2px;animation:fall linear forwards}
.phx .tap{font-size:14px;color:rgba(255,255,255,.7)}
@keyframes phxIn{from{opacity:0}to{opacity:1}}
@keyframes phxOut{to{opacity:0}}
@keyframes capIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes phDance{0%,100%{transform:translateY(0) rotate(-8deg)}25%{transform:translateY(-26px) rotate(0)}50%{transform:translateY(0) rotate(8deg)}75%{transform:translateY(-26px) rotate(0)}}
@keyframes waveL{from{transform:rotate(30deg)}to{transform:rotate(-40deg)}}
@keyframes waveR{from{transform:rotate(-30deg)}to{transform:rotate(40deg)}}
@keyframes crownIn{from{opacity:0;transform:translateY(-120px)}to{opacity:1;transform:none}}
@keyframes shadesIn{from{opacity:0;transform:translateY(-60px)}to{opacity:1;transform:none}}
@keyframes laugh{from{transform:scaleY(1)}to{transform:scaleY(.6)}}
@keyframes phSlump{0%{transform:none}8%,12%,16%{transform:translateX(-8px)}10%,14%{transform:translateX(8px)}40%{transform:translateY(10px) rotate(-4deg) scale(.97)}100%{transform:translateY(34px) rotate(-9deg) scale(.92)}}
@keyframes dim{to{filter:saturate(.2) brightness(.75)}}
@keyframes tear{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(60px);opacity:0}}
@keyframes crack{to{stroke-dashoffset:0}}
@keyframes cloudIn{from{opacity:0;transform:translateY(-60px)}to{opacity:1;transform:none}}
@keyframes rain{from{transform:translateY(0)}to{transform:translateY(105vh)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.phx *{animation-duration:.01s!important;animation-iteration-count:1!important}}

<body>


<div class="app" id="app" dir="rtl">
  <header class="top">
    <h1>السياگ <span class="latin">SYAG</span></h1>
    <details class="settings">
      <summary data-t="settings"></summary>
      <div class="panel">
        <label for="mode"><span data-t="mode"></span>
          <select id="mode"><option value="ai" selected data-t="modeAI"></option><option value="pvp" data-t="modePvP"></option></select>
        </label>
        <label for="level"><span data-t="level"></span>
          <select id="level"><option value="1" data-t="lvEasy"></option><option value="2" data-t="lvMid" selected></option><option value="3" data-t="lvHard"></option></select>
        </label>
        <label for="speed"><span data-t="speed"></span>
          <select id="speed"><option value="1" data-t="speedNormal" selected></option><option value="0.55" data-t="speedFast"></option></select>
        </label>
        <label for="players"><span data-t="players"></span>
          <select id="players"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select>
        </label>
        <label for="nameA"><span data-t="nameA"></span><input id="nameA" type="text" maxlength="18" autocomplete="off"></label>
        <label for="nameB"><span data-t="nameB"></span><input id="nameB" type="text" maxlength="18" autocomplete="off"></label>
        <div class="kpick"><span data-t="kindA"></span><div class="sw" id="kindA"></div></div>
        <div class="kpick"><span data-t="kindB"></span><div class="sw" id="kindB"></div></div>
        <p class="knote" data-t="kindNote"></p>
        <div class="bgpick"><span data-t="bgLabel"></span><div class="sw" id="bgSw"></div></div>
        <label class="check" for="fxOn"><input type="checkbox" id="fxOn" checked> <span data-t="fxLabel"></span></label>
        <label class="check" for="voiceOn"><input type="checkbox" id="voiceOn" checked> <span data-t="voiceLabel"></span></label>
        <label class="check" for="autoFocus"><input type="checkbox" id="autoFocus" checked> <span data-t="autoFocus"></span></label>
        <div class="row">
          <button class="btn btn-ghost" id="newGame" type="button" data-t="newGame"></button>
        </div>
      </div>
    </details>
  </header>
  <div class="quick">
    <select id="lang" class="langsel" aria-label="Language / اللغة">
      <option value="dar">الدارجة</option>
      <option value="ar">العربية</option>
      <option value="fr">Français</option>
      <option value="en">English</option>
    </select>
    <button class="tg" id="soundBtn" type="button" aria-pressed="true"><span class="dot"></span><span id="soundTxt"></span></button>
    <button class="tg" id="themeBtn" type="button"><span class="dot"></span><span id="themeTxt"></span></button>
  </div>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" id="tabPlay" aria-selected="true" data-t="tabPlay"></button>
    <button type="button" role="tab" id="tabLearn" aria-selected="false" data-t="tabLearn"></button>
  </nav>

  <section class="learn" id="viewLearn" hidden>
    <div class="about"><h2 id="aboutTitle"></h2><div id="aboutText"></div></div>
    <div class="tray ltray">
      <div class="sticks" id="lSticks"></div>
      <div class="lres" id="lResult" aria-live="polite"></div>
      <div id="lSeq"></div>
      <button class="btn btn-throw" id="lThrow" type="button"></button>
    </div>
    <div class="steps">
      <h2 data-t="stepsTitle"></h2>
      <ol id="stepsList"></ol>
    </div>
  </section>

  <div id="viewPlay" class="viewplay">
  <section class="status" aria-live="polite">
    <div class="turn"><span class="token" id="turnToken"></span><div><span id="turnName"></span><small id="turnPlayer"></small></div></div>
    <div class="count" id="counts"></div>
  </section>

  <div id="winBox"></div>

  <section class="play" id="play">
    <div class="tray">
      <div class="sticks" id="sticks"></div>
      <div class="result" id="result" aria-live="polite"></div>
      <div class="qura" id="qura" hidden><div class="bowl"><div class="q-items" id="quraItems"></div></div><span class="q-label" id="quraLabel"></span></div>
      <div class="pool" id="pool"></div>
      <div class="total" id="total"></div>
      <button class="btn btn-throw" id="throwBtn" type="button"></button>
    </div>
    <div class="boardcol">
      <div class="zoom"><span data-t="zoom"></span><span class="zb"><button type="button" id="zoomOut">−</button><button type="button" id="zoomIn">+</button></span></div>
      <div class="padwrap"><div class="pad">
        <div class="colnames"><span id="colB"></span><span id="colA"></span></div>
        <div class="board" id="board"></div>
      </div></div>
      <div class="deadrow">
        <div class="dead" id="deadB"></div>
        <div class="dead" id="deadA"></div>
      </div>
    </div>
  </section>

  <ul class="log" id="log"></ul>
  </div>
  <div class="resume" id="resume" hidden><div class="rbox" role="dialog" aria-modal="true" aria-labelledby="resumeTitle"><h2 id="resumeTitle" data-t="resumeTitle"></h2><p id="resumeInfo"></p><div class="rbtn"><button class="btn btn-throw" id="resumeBtn" type="button" data-t="resumeBtn"></button><button class="btn btn-ghost" id="freshBtn" type="button" data-t="newGame"></button></div></div></div>

  <details class="rules">
    <summary data-t="rules"></summary>
    <ul id="rulesList"></ul>
    <div class="legend" id="legend"></div>
  </details>
</div>

   tip:{1:['سيگ: نقطة واحدة، ورمية رابحة','تعيد الرمي مباشرة. السيگ هو المفتاح: به يسلّم الولد. قبل أن يسلم جميع الأولاد (12 سيگ)، لا يصلح السيگ إلا للتسليم.'],
    2:['إيشو: نقطتان، ورمية خاسرة','تتوقف الرمية هنا، لكن النقطتين لا تضيعان: تضعهما على ولد سالم مع ما جمعته. فالإيشو خاسر في الرمي ورابح في الحركة.'],

   seqDone:'انتهت الرمية: {s}. المجموع {n}، لكن كل نتيجة توضع وحدها على ولد سالم، وبالترتيب الذي تختاره.',seqNewTurn:'دور جديد بدأ بدار ثلاث وانتهى فورًا: تضع الثلاث وينتقل الدور.',seqGoing:'المجموع حتى الآن: {n}. ما زال دورك، أعد الرمي.',
   learnRestart:'أعد الأمثلة من البداية',learnNext:'المثال التالي: {r}',learnFirst:'ارمِ السياگ: {r}',
   rulesHTML:['أربعة عيدان (غالبًا من الزيتون): وجه أبيض ووجه داكن.','سيگ (3 داكنة وواحد أبيض) = 1، إيشو (2 و2) = 2، دار ثلاث (3 بيضاء وواحد داكن) = 3، أربعة (4 بيضاء) = 4، ستة (4 داكنة) = 6.','السيگ والأربعة والستة رابحة: يعيد الفريق الرمي دون أن يضع ويجمع النتائج. الإيشو ودار ثلاث خاسرتان: تتوقف الرمية ويضع الفريق ما جمعه.','توضع كل نتيجة وحدها، ويختار الفريق الولد والترتيب. مثلًا: سيگان، أربعة، ستة، إيشو: المجموع 14، لكن كل واحدة تُلعب وحدها.','لكل فريق 12 ولدًا. الولد الذي يُفتح بالسيگ يصبح سالمًا، ولا يتحرك بالنتائج الأخرى إلا السالمون.','قبل أن يسلم جميع الأولاد (12 سيگ)، لا يصلح السيگ إلا للتسليم، ويدور السالمون في الوديان الداخلية فقط.','بعد تسليم الجميع، يدخلون وادي الخصم من الأعلى ويبدؤون الأكل، ويبقون يدورون في جهة الخصم.','لا يمكن أن يكون ولدان من الفريق نفسه في الثقب نفسه. إن أوصل الحساب الولد إلى مكان أخيه، يُحبس ويتحرك ولد آخر.','الجران: بعد تسليم جميع الأولاد، يمكنك جمع سالمَين في ثقب واحد. يتحركان معًا ولا يفترقان إلا بسيگ. وإن وقع عليهما الخصم قتلهما معًا.','إن وقعت تمامًا في ثقب فيه أولاد الخصم: عليه! تأكلهم، ويُجمعون في جهتك.','القرعة: إن لم يكن لديك أي سالم، توضع الأربعة والستة في القرعة. إن جاء سيگ في الدور نفسه تلعبها، وإلا ضاعت.','الصلية: إن وقف عود على جانبه يُعاد رميه. وهي نادرة وعشوائية.','يفوز الفريق الذي يقضي على جميع أولاد الخصم.'],
   stepsHTML:['<b>السياگ:</b> أربعة عيدان (غالبًا من الزيتون)، وجه أبيض ووجه داكن. كل رمية تعطي إحدى النتائج الخمس.','<b>الرابحة والخاسرة:</b> السيگ والأربعة والستة رابحة، تعيد الرمي وتجمع. الإيشو ودار ثلاث خاسرتان، تتوقف الرمية، لكنهما توضعان أيضًا.','<b>الأولاد:</b> لكل فريق 12 ولدًا في واديه. لا يتحرك الولد حتى تحصل له على سيگ، فيصبح سالمًا.','<b>التسليم:</b> قبل تسليم الجميع، لا يصلح السيگ إلا للتسليم، ويدور السالمون في الوديان الداخلية فقط.','<b>الهجوم:</b> بعد تسليم الجميع، يدخلون وادي الخصم. إن وقعت تمامًا على ولده: عليه!','<b>الجران:</b> سالمان في ثقب واحد يتحركان معًا، ولتفريقهما تحتاج إلى سيگ.','<b>القرعة:</b> إن لم يكن لديك أي سالم، توضع الأربعة والستة في القرعة حتى يأتي السيگ.','<b>الفوز:</b> من يقضي على جميع أولاد الخصم يفوز.']},

   seqDone:'Fin du lancer : {s}. Total {n}, mais chaque résultat se place séparément sur un ould salem, dans l’ordre que tu veux.',seqNewTurn:'Nouveau tour qui commence par un dar tlet et s’arrête aussitôt : tu places les 3 et la main passe.',seqGoing:'Total pour l’instant : {n}. C’est toujours ton tour, relance.',
   learnRestart:'Recommencer les exemples',learnNext:'Exemple suivant : {r}',learnFirst:'Lancer : {r}',
   rulesHTML:['4 siyag (souvent en bois d’olivier) : une face blanche et une face foncée.','Sig (3 foncés, 1 blanc) = 1, Ichou (2 et 2) = 2, Dar tlet (3 blancs, 1 foncé) = 3, Quatre (4 blancs) = 4, Six (4 foncés) = 6.','Sig, Quatre et Six sont gagnants : l’équipe relance sans placer et cumule. Ichou et Dar tlet sont perdants : le lancer s’arrête et l’équipe place ce qu’elle a cumulé.','Chaque résultat se place séparément, et l’équipe choisit l’ould et l’ordre. Par exemple 2 × Sig, Quatre, Six, Ichou : total 14, mais chacun se joue à part.','Chaque équipe a 12 ouled. Un ould ouvert avec un sig devient salem, et seuls les salem bougent avec les autres résultats.','Tant que les 12 ouled ne sont pas salem, le sig sert seulement à ouvrir un ould, et les salem tournent seulement dans les deux lignes intérieures.','Quand les 12 sont salem, ils entrent dans la ligne de l’adversaire par le haut et commencent à manger, en tournant toujours de son côté.','Deux ouled de la même équipe ne peuvent pas être dans le même trou. Si le compte fait tomber un ould sur son frère, il est bloqué et on en bouge un autre.','Le jrane : quand les 12 sont salem, tu peux réunir deux salem dans un trou. Ils avancent ensemble et ne se séparent qu’avec un sig. Si l’adversaire tombe dessus, il mange les deux.','Si tu tombes pile sur des ouled de l’adversaire : touché ! Tu les manges et ils rejoignent ton côté.','La guerâa (la bouteille) : si tu n’as aucun salem, les quatre et les six vont dans la bouteille. Si un sig arrive dans le même tour, tu les joues, sinon ils sont perdus.','La salia : si un bâtonnet tombe sur la tranche, on le relance. C’est rare et aléatoire.','L’équipe qui élimine tous les ouled de l’adversaire gagne.'],
   stepsHTML:['<b>Les siyag :</b> 4 bâtonnets (souvent en olivier), une face blanche et une face foncée. Chaque lancer donne un des 5 résultats.','<b>Gagnants et perdants :</b> Sig, Quatre et Six sont gagnants : tu relances et tu cumules. Ichou et Dar tlet sont perdants : le lancer s’arrête, mais ils se placent aussi.','<b>Les ouled :</b> chaque équipe a 12 ouled dans sa ligne. Un ould ne bouge pas tant qu’il n’a pas reçu un sig ; il devient alors salem.','<b>Le sellem :</b> tant que les 12 ne sont pas salem, le sig sert seulement à ouvrir, et les salem tournent dans les lignes intérieures.','<b>L’attaque :</b> quand les 12 sont salem, ils entrent chez l’adversaire. Si tu tombes pile sur un de ses ouled : touché !','<b>Le jrane :</b> deux salem dans le même trou avancent ensemble ; il faut un sig pour les séparer.','<b>La guerâa :</b> sans aucun salem, les quatre et les six vont dans la bouteille en attendant un sig.','<b>La victoire :</b> celui qui élimine tous les ouled de l’adversaire gagne.']},

   learnRestart:'Restart the examples',learnNext:'Next example: {r}',learnFirst:'Throw: {r}',
   rulesHTML:['4 siyag (often olive wood): one white face and one dark face.','Sig (3 dark, 1 white) = 1, Ishou (2 and 2) = 2, Dar tlet (3 white, 1 dark) = 3, Four (4 white) = 4, Six (4 dark) = 6.','Sig, Four and Six are winning throws: the team throws again without placing and collects. Ishou and Dar tlet are losing throws: the throw ends and the team places what it collected.','Each result is placed on its own, and the team picks the ould and the order. For example 2 × Sig, Four, Six, Ishou: total 14, but each is played separately.','Each team has 12 ouled. An ould opened with a sig becomes salem, and only salem ouled move with the other results.','Until all 12 ouled are salem, a sig can only open an ould, and salem ouled only circle the two inner lines.','Once all 12 are salem, they enter the opponent’s line from the top and start taking, always circling on the opponent’s side.','Two ouled of the same team cannot share a hole. If the count lands an ould on its brother, it is blocked and another one moves.','The jrane: once all 12 are salem, you may join two salem in one hole. They move together and only split with a sig. If the opponent lands on them, he takes both.','If you land exactly on the opponent’s ouled: got him! You take them and they gather on your side.','The guer3a (glass bottle): if you have no salem, fours and sixes go into the bottle. If a sig comes in the same turn you play them, otherwise they are lost.','The salia: if a stick lands on its edge, it is thrown again. It is rare and random.','The team that eliminates all of the opponent’s ouled wins.'],
   stepsHTML:['<b>The siyag:</b> 4 sticks (often olive wood), one white face and one dark face. Each throw gives one of 5 results.','<b>Winning and losing:</b> Sig, Four and Six are winning: you throw again and collect. Ishou and Dar tlet are losing: the throw ends, but they are placed too.','<b>The ouled:</b> each team has 12 ouled in its line. An ould does not move until it gets a sig; then it becomes salem.','<b>Sellem:</b> until all 12 are salem, a sig only opens ouled, and salem ouled circle the inner lines only.','<b>Attack:</b> once all 12 are salem, they enter the opponent’s line. Land exactly on one of his ouled: got him!','<b>The jrane:</b> two salem in the same hole move together; you need a sig to split them.','<b>The guer3a:</b> with no salem, fours and sixes go into the bottle until a sig comes.','<b>Winning:</b> whoever eliminates all of the opponent’s ouled wins.']}

  const CNUM={3:'ثلاث',4:'ربع',5:'خمس',6:'ست',7:'سبع',8:'تمن',9:'تسع',10:'عشر'};
  function countName(v,n){
    if(n===1)return NM(v);

    if(v===4)return n===2?'أربعتين':(CNUM[n]||n)+' أربعات';

    if(LANG==='dar')return summary(list).replace(/سيگين/g,'سيكين').replace(/سياگ/g,'سياك').replace(/سيگ/g,'سيك');

  const KINDS=['stick-wood','stick-dark','stick-red','date','olive','stone'];

  /* ---------- theme ---------- */
  function isDark(){const a=document.documentElement.getAttribute('data-theme');if(a)return a==='dark';try{return matchMedia('(prefers-color-scheme: dark)').matches}catch(e){return false}}

  /* ---------- sticks ---------- */
  function mkShape(i){let s=i*977+131;const r=()=>{s=(s*9301+49297)%233280;return s/233280;};
    const L=[],R=[];for(let k=0;k<=11;k++){const y=4+k*19.3;const b=Math.sin(k/11*Math.PI)*1.5;L.push([5-b+(r()-.5)*1.6,y]);R.push([31+b+(r()-.5)*1.6,y]);}
    const ct=(r()-.5)*6,cb=(r()-.5)*6;L[0][1]+=ct;R[0][1]-=ct;L[11][1]+=cb;R[11][1]-=cb;
    const pts=L.concat(R.slice().reverse()).map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    return {pts,knots:[0,1,2].map(()=>({x:11+r()*14,y:30+r()*160,s:1.3+r()*2})),dots:Array.from({length:16},()=>({x:8+r()*20,y:12+r()*196})),tilt:(r()-.5)*5};}

      '<stop offset="0" stop-color="#C4AE80"/><stop offset=".45" stop-color="#F3EAD2"/><stop offset=".7" stop-color="#E4D5B0"/><stop offset="1" stop-color="#B89F70"/>':
      '<stop offset="0" stop-color="#22341A"/><stop offset=".38" stop-color="#5A7A40"/><stop offset=".62" stop-color="#4A6634"/><stop offset="1" stop-color="#1C2C15"/>')+
      '</linearGradient><filter id="f'+id+'" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="'+(white?'0.9 0.012':'0.22 0.05')+'" numOctaves="2" seed="'+(i+3)+'"/><feColorMatrix values="'+(white?'0 0 0 0 .45 0 0 0 0 .31 0 0 0 0 .15 0 0 0 1.1 -.38':'0 0 0 0 .07 0 0 0 0 .11 0 0 0 0 .04 0 0 0 1.4 -.45')+'"/></filter><clipPath id="c'+id+'"><polygon points="'+sh.pts+'"/></clipPath></defs>'+
      '<polygon points="'+sh.pts+'" fill="url(#g'+id+')"/><g clip-path="url(#c'+id+')"><rect width="36" height="220" filter="url(#f'+id+')"/>';
    if(white){sh.knots.forEach(k=>h+='<ellipse cx="'+k.x.toFixed(1)+'" cy="'+k.y.toFixed(1)+'" rx="'+k.s.toFixed(1)+'" ry="'+(k.s*1.8).toFixed(1)+'" fill="#A07D4A" opacity=".75"/><ellipse cx="'+k.x.toFixed(1)+'" cy="'+k.y.toFixed(1)+'" rx="'+(k.s*.45).toFixed(1)+'" ry="'+(k.s*.8).toFixed(1)+'" fill="#5E4426"/>');h+='<rect x="15" y="6" width="2.5" height="208" fill="#fff" opacity=".22"/>';}
    else{sh.dots.forEach(d=>h+='<ellipse cx="'+d.x.toFixed(1)+'" cy="'+d.y.toFixed(1)+'" rx=".5" ry="1.1" fill="#B5C58F" opacity=".7"/>');sh.knots.forEach(k=>h+='<ellipse cx="'+k.x.toFixed(1)+'" cy="'+k.y.toFixed(1)+'" rx="'+(k.s*1.2).toFixed(1)+'" ry="'+(k.s*1.6).toFixed(1)+'" fill="#1A2812" stroke="#7E9658" stroke-width=".6"/>');h+='<rect x="13" y="6" width="2" height="208" fill="#D8E6B0" opacity=".14"/>';}
    return h+'</g><polygon points="'+sh.pts+'" fill="none" stroke="rgba(0,0,0,.3)" stroke-width=".6"/></svg>';
  }

  const clipBuf={};let clipSrcs=[];
  function loadClips(){if(!AC)return;for(const k in CLIPS){if(k in clipBuf)continue;clipBuf[k]=null;try{const bin=atob(CLIPS[k].split(',')[1]);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);AC.decodeAudioData(u.buffer,b=>{clipBuf[k]=b},()=>{delete clipBuf[k]});}catch(e){delete clipBuf[k]}}}

    try{if(navigator.share&&!imgOnly){await navigator.share({title:'SYAG',text:txt,url:GAME_URL});return;}}catch(e){if(e&&e.name==='AbortError')return;}
    if(blob)downloadBlob(blob);
    try{await navigator.clipboard.writeText(txt+' '+GAME_URL);toast(T('copied'));}catch(e){}
  }
  function downloadBlob(blob){try{const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='syag-resultat.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);}catch(e){}}
  async function saveCard(){audio();try{const b=await makeCard();if(b)downloadBlob(b);}catch(e){}}

  function score(){let sc={A:0,B:0};try{sc=JSON.parse(localStorage.getItem('syag-score')||'null')||sc}catch(e){}return sc;}
  function addWin(t){const sc=score();sc[t]=(sc[t]||0)+1;try{localStorage.setItem('syag-score',JSON.stringify(sc))}catch(e){}}
  function vib(p){try{if(soundOn&&fxOn&&navigator.vibrate)navigator.vibrate(p)}catch(e){}}
  function toast(msg){const box=document.createElement('div');box.className='cheer';box.innerHTML='<div class="msg toastmsg"></div>';box.firstChild.textContent=msg;document.body.appendChild(box);setTimeout(()=>box.remove(),1700);}
  function legend(){
    const pat={1:'kkkw',2:'kkww',3:'kwww',4:'wwww',6:'kkkk'};
    $('legend').innerHTML=[1,2,3,4,6].map(v=>'<span class="chip'+(AGAIN.has(v)?' win':'')+'"><span class="mini">'+pat[v].split('').map(c=>'<i class="'+c+'"></i>').join('')+'</span>'+NM(v)+' '+v+'</span>').join('');
  }
  function flyToCaptor(vic,t,k){
    let reduce=false;try{reduce=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
    const cell=document.querySelector('.cell[data-k="'+k+'"]'),box=$('dead'+t);
    if(reduce||!cell||!box||!document.body.animate)return Promise.resolve();
    const a=cell.getBoundingClientRect(),b=box.getBoundingClientRect();
    return Promise.all(vic.map((v,i)=>{
      const el=document.createElement('span');el.className=pcc(v.team)+' fly';
      el.style.left=(a.left+a.width/2-6)+'px';el.style.top=(a.top+a.height/2-10)+'px';document.body.appendChild(el);
      const dx=b.left+b.width/2-(a.left+a.width/2)+(i*10),dy=b.top+b.height/2-(a.top+a.height/2);
      const an=el.animate([{transform:'translate(0,0) scale(1.4)'},{transform:'translate('+dx*0.5+'px,'+(dy*0.5-60)+'px) scale(1.6) rotate(200deg)',offset:0.5},{transform:'translate('+dx+'px,'+dy+'px) scale(.9) rotate(360deg)'}],{duration:800,delay:i*120,easing:'cubic-bezier(.4,.2,.3,1)',fill:'forwards'});
      return an.finished.then(()=>el.remove()).catch(()=>el.remove());
    }));
  }
  
  /* ---------- turn flow ---------- */
  async function doThrow(){
    lastSticks=null;
    if(!S||S.phase!=='throw'||S.busy||S.winner)return;
    S.busy=true;S.salia=false;S.val=null;
    let st=randomSticks();
    S.sticks=null;S.layout=null;render();
    S.layout=makeLayout($('sticks'));
    await throwAnim($('sticks'),st,S.layout);
    S.sticks=st.slice();render();
    if(st.includes('edge')){st=await resolveSalia(st,on=>{S.salia=on;if(!on)S.sticks=null;render();});S.sticks=st;addLog('logSalia');render();}
    const v=VAL[st.filter(s=>s==='w').length];const t=S.turn;const win=AGAIN.has(v);
    S.val=v;announce(v);addLog('logGot',{t:'@'+t,r:'#r:'+v});
    if(S.stats){S.stats.throws[t]=(S.stats.throws[t]||0)+1;}
    S.streak=win?(S.streak||0)+1:0;
    if(win&&(S.streak===3||S.streak===5||S.streak>=7)){setTimeout(()=>{toast(T(S.streak>=5?'streak5':'streak3',{n:S.streak}));applause(S.streak>=5?2:1.2);},500);}
    const locked=active(t).length===0&&!S.pool.includes(1);
    if(locked&&v!==1){
      if(win){S.qura.push(v);addLog('logToQura',{r:'#r:'+v});S.busy=false;render();if(isAI())setTimeout(doThrow,1200);return;}
      render();await sleep(900);
      if(S.qura.length){S.quraFx='lost';addLog('logQuraLost');render();await sleep(1400);}
      else addLog('logNoSalem',{t:'@'+t});
      S.qura=[];S.quraFx=null;render();await sleep(500);S.busy=false;passTurn();return;
    }
    if(v===1&&S.qura.length){render();await sleep(500);S.quraFx='pour';render();await sleep(950);S.pool=S.qura.concat(S.pool);S.qura=[];S.quraFx=null;addLog('logQuraOut');}
    S.pool.push(v);
    if(win){S.busy=false;render();if(isAI())setTimeout(doThrow,1100);return;}
    S.phase='place';S.sel=-1;render();await sleep(900);S.busy=false;
    startPlace();
  }
  function startPlace(){
    const t=S.turn;
    S.phase='place';S.sel=S.pool.findIndex(v=>usable(t,v));
    if(S.pool.length>1){addLog('logCollected',{t:'@'+t,s:'#s:'+S.pool.join(',')});const sp=spokenSummary(S.pool),ck=counted(S.pool).map(([v,n])=>clipKey(v,n));setTimeout(()=>{if(!playClips(ck))say(sp,'neutral');},900);}
    if(S.sel<0){addLog('logNone');S.pool=[];render();setTimeout(passTurn,1200);return;}
    render();
    if(isAI())setTimeout(aiPlace,900);else autoIfSingle();
  }
  function autoIfSingle(){
    if(S.pool.length!==1)return;
    const ms=movesFor(S.turn,S.pool[0]);
    if(ms.length===1)setTimeout(()=>applyMove(ms[0],0),700);
  }
  async function applyMove(m,idx){
    if(!m||S.phase!=='place'||S.busy||S.pool[idx]==null)return;
    S.busy=true;
    const t=S.turn,v=S.pool[idx],ps=m.pids.map(id=>S.pions[id]);
    const canEat=!m.exit;
    S.pool.splice(idx,1);S.sel=-1;S.val=v;
    if(!playClips([clipKey(v)]))say(D().speak[v],AGAIN.has(v)?'win':'neutral');
    S.movingIds=m.pids.slice();render();await sleep(500);
    if(m.exit){
      const p=ps[0];p.home=false;p.pos=m.to;woodHit(0,0.4);render();await sleep(450);
      vib(40);if(!S.sellem[t]){S.sellem[t]=true;addLog('logFirstSalem',{t:'@'+t});applause();cheer(T('cheerFirst',{t:TN(t)}));await sleep(2600);}
      else{salemSound();addLog('logSalem',{t:'@'+t,n:12-inactive(t).length});await sleep(700);}
      if(allSalem(t)&&!S.full[t]){S.full[t]=true;addLog('logAllSalem',{t:'@'+t});applause(3.2);zaghrouta(0.3);cheer(T('logAllSalem',{t:TN(t)}),true);await sleep(3300);}
    } else {
      for(let k=0;k<v;k++){ps.forEach(p=>p.pos=step(t,p.pos,m.route));woodHit(0,0.22);render();await sleep(380);}
      await sleep(200);
      const lv={t:'@'+t,r:'#r:'+v};if(ps.length>1)lv.suffix='withJran';else if(m.split)lv.suffix='splitJran';
      addLog('logPlaced',lv);
    }
    S.movingIds=[];
    const to=ps[0].pos;
    if(!m.exit&&ownAt(t,to,[])===2&&!m.split&&ps.length===1)addLog('logJran',{t:'@'+t});
    const vic=canEat?victimsAt(t,to):[];
    if(vic.length){
      captureSound(vic.length);vib([60,40,120]);setTimeout(()=>{if(!playClips(['hit']))say(T('hitSay'),'dare');},200);
      {const box=document.createElement('div');box.className='cheer';box.innerHTML='<div class="msg hitmsg"></div>';box.firstChild.textContent=T('hit');document.body.appendChild(box);setTimeout(()=>box.remove(),1900);}
      const hk=key(pathCell(t,to));S.hit={k:hk,n:vic.length};
      addLog('logKill',{t:'@'+t,o:'@'+other(t),w:vic.length>1?T('nOuld',{n:vic.length}):T('oneOuld')});
      render();await sleep(700);
      vic.forEach(x=>x.alive=false);const fly=flyToCaptor(vic,t,hk);render();await fly;await sleep(500);S.hit=null;
    }
    S.busy=false;
    if(alive(other(t)).length===0){S.winner=t;S.phase='over';if(S.stats)S.stats.end=Date.now();addWin(t);vib([80,60,80,60,200]);S.pool=[];addLog('logOver');render();applause(3.5);zaghrouta(0.2);if(S.mode==='ai')setTimeout(()=>{if(S.phase!=='over')return;phoneShow(t!=='A');playClips([t==='A'?'phoneLose':'phoneWin']);},2600);else setTimeout(()=>{if(S.phase==='over'&&S.winner===t)say(T('win',{t:TN(t)}),'win');},2600);cheer(T('win',{t:TN(t)}),true);return;}
    const ni=S.pool.findIndex(x=>usable(t,x));
    if(ni<0){if(S.pool.length)addLog('logLeft',{s:'#s:'+S.pool.join(',')});S.pool=[];render();await sleep(800);passTurn();return;}
    S.sel=ni;render();
    if(isAI())setTimeout(aiPlace,700);else autoIfSingle();
  }
  function danger(t,pos){if(!allSalem(other(t)))return 0;const k=key(pathCell(t,pos));let d=0;const o=other(t);
    active(o).forEach(p=>{for(const v of [1,2,3,4,6]){if(key(pathCell(o,adv(o,p.pos,v,'in')))===k||key(pathCell(o,adv(o,p.pos,v,'loop')))===k){d++;break;}}});return d;}
  function aiPlace(){
    if(S.phase!=='place'||S.busy)return;
    const t=S.turn;let best=null,bs=-1e9;
    S.pool.forEach((v,idx)=>movesFor(t,v).forEach(m=>{
      let s;
      if(LVL===1){s=Math.random()*10+(!m.exit?victimsAt(t,m.to).length*20:0);}
      else{s=(!m.exit?victimsAt(t,m.to).length*100:0)+Math.random()*6+(m.route==='in'?(alive(other(t)).length>3?8:-8):0);
        if(LVL===3){const nowD=danger(t,S.pions[m.pids[0]].pos),newD=danger(t,m.to);s+=(nowD-newD)*25*m.pids.length;if(m.exit)s+=30;}}
      if(m.exit)s+=60;else s+=m.to*0.2+(m.pids.length>1?-4:0);
      if(s>bs){bs=s;best={m,idx};}
    }));
    if(best){S.sel=best.idx;render();setTimeout(()=>applyMove(best.m,best.idx),500);}
  }
  function announceTurn(){
    const nm=isAI()?T('phone'):(S.players>1?T('playerSay',{t:TN(S.turn),i:S.ptr[S.turn]+1}):TN(S.turn));
    say(T('turnSay',{n:nm}),'neutral');
  }
  function passTurn(){
    const n=other(S.turn);S.turn=n;S.ptr[n]=(S.ptr[n]+1)%S.players;
    S.phase='throw';S.pool=[];S.qura=[];S.quraFx=null;S.sel=-1;S.val=null;S.streak=0;render();
    announceTurn();
    if(isAI())setTimeout(doThrow,2000);
  }
  
  /* ---------- events ---------- */
  $('board').addEventListener('click',e=>{
    const c=e.target.closest('.cell');if(!c||!c.classList.contains('can')||S.busy||S.phase!=='place')return;
    const k=c.dataset.k;
    if(S.choose){const m=S.choose.find(m=>key(pathCell(S.turn,m.to))===k);S.choose=null;if(m)applyMove(m,S.sel);else render();return;}
    const ms=movesFor(S.turn,S.pool[S.sel]).filter(m=>key(cellOf(S.pions[m.pids[0]]))===k);
    if(ms.length>1){S.choose=ms;render();}else if(ms.length)applyMove(ms[0],S.sel);
  });
  $('pool').addEventListener('click',e=>{
    const b=e.target.closest('.pchip');if(!b||b.disabled||S.phase!=='place'||S.busy||isAI())return;S.choose=null;
    S.sel=+b.dataset.i;render();
  });
  $('throwBtn').addEventListener('click',()=>{audio();doThrow();});
  let zoom=1,autoFocus=true;
  try{zoom=+localStorage.getItem('sig-zoom')||1;autoFocus=localStorage.getItem('sig-focus')!=='0';}catch(e){}
  function applyZoom(){zoom=Math.min(1.8,Math.max(0.8,Math.round(zoom*10)/10));$('board').style.setProperty('--z',zoom);$('zoomOut').disabled=zoom<=0.8;$('zoomIn').disabled=zoom>=1.8;try{localStorage.setItem('sig-zoom',zoom)}catch(e){}}
  $('zoomIn').addEventListener('click',()=>{zoom+=0.2;applyZoom();});
  $('zoomOut').addEventListener('click',()=>{zoom-=0.2;applyZoom();});
  $('fxOn').checked=fxOn;$('voiceOn').checked=voiceOn;
  $('fxOn').addEventListener('change',()=>{fxOn=$('fxOn').checked;try{localStorage.setItem('syag-fx',fxOn?'1':'0')}catch(e){}if(fxOn){audio();woodHit(0,0.6);}});
  $('voiceOn').addEventListener('change',()=>{voiceOn=$('voiceOn').checked;try{localStorage.setItem('syag-voice',voiceOn?'1':'0')}catch(e){}if(voiceOn&&!playClips(['v1x1']))say(D().speak[1]+'!','win');else try{speechSynthesis.cancel()}catch(e){}});
  $('autoFocus').checked=autoFocus;
  $('autoFocus').addEventListener('change',()=>{autoFocus=$('autoFocus').checked;try{localStorage.setItem('sig-focus',autoFocus?'1':'0')}catch(e){}render();});
  applyZoom();
  function newGame(){S=fresh($('mode').value,+$('players').value);render();announceTurn();}
  let confirmT=null;
  $('newGame').addEventListener('click',()=>{audio();const btn=$('newGame');
    const inProgress=S&&!S.winner&&!gameUntouched();
    if(inProgress&&!confirmT){btn.textContent=T('confirmNew');btn.classList.add('warn');confirmT=setTimeout(()=>{confirmT=null;btn.textContent=T('newGame');btn.classList.remove('warn');},3500);return;}
    clearTimeout(confirmT);confirmT=null;btn.textContent=T('newGame');btn.classList.remove('warn');
    newGame();btn.closest('details').open=false;kick();});
  $('level').value=String(LVL);$('speed').value=String(SPD);
  $('level').addEventListener('change',()=>{LVL=+$('level').value;try{localStorage.setItem('syag-level',LVL)}catch(e){}});
  $('speed').addEventListener('change',()=>{SPD=+$('speed').value;try{localStorage.setItem('syag-speed',SPD)}catch(e){}});
  $('mode').addEventListener('change',()=>{newGame();kick();});
  $('players').addEventListener('change',()=>{S.players=+$('players').value;S.ptr={A:0,B:0};render();});
  ['A','B'].forEach(t=>{const inp=$('name'+t);inp.value=CUSTOM[t];
    inp.addEventListener('input',()=>{CUSTOM[t]=inp.value.trim();try{localStorage.setItem('syag-names',JSON.stringify(CUSTOM))}catch(e){}render();});});
  $('lang').addEventListener('change',()=>{LANG=$('lang').value;try{localStorage.setItem('syag-lang',LANG)}catch(e){}applyLang();});
  
  /* ---------- learn tab ---------- */
  const L={sticks:null,layout:null,busy:false,seq:[],salia:false,step:0};
  const DEMO=[{v:1,f:['k','w','k','k']},{v:4,f:['w','w','w','w']},{v:6,f:['k','k','k','k']},{v:2,f:['w','k','k','w']},{v:3,f:['w','k','w','w']}];
  function renderLearn(){
    drawSticks($('lSticks'),L.sticks,L.layout);
    const d=D(),last=L.seq[L.seq.length-1];
    const lr=$('lResult');
    if(last){const tip=d.tip[last];lr.innerHTML='<p class="lstep"></p><div class="name"></div><p class="lshape"></p><p class="lt '+(AGAIN.has(last)?'w':'l')+'"></p><p class="ld"></p>';
      lr.children[0].textContent=T('stepOf',{i:L.step});lr.children[1].textContent=NM(last);lr.children[2].textContent=d.shape[last];lr.children[3].textContent=tip[0];lr.children[4].textContent=tip[1];}
    else{lr.innerHTML='<p></p>';lr.firstChild.textContent=T('learnIntro');}
    const ls=$('lSeq');
    if(L.seq.length){
      const done=last&&!AGAIN.has(last),sum=L.seq.reduce((a,b)=>a+b,0);
      ls.innerHTML='<div class="pool">'+L.seq.map(v=>'<span class="pchip idle">'+NM(v)+' <b>'+v+'</b></span>').join('')+'</div><p class="hint"></p>';
      ls.lastChild.textContent=done?(L.seq.length>1?T('seqDone',{s:summary(L.seq),n:sum}):T('seqNewTurn')):T('seqGoing',{n:sum});
    } else ls.innerHTML='';
    $('lThrow').disabled=L.busy;
    $('lThrow').textContent=L.step>=DEMO.length?T('learnRestart'):L.step?T('learnNext',{r:NM(DEMO[L.step].v)}):T('learnFirst',{r:NM(DEMO[0].v)});
  }
  async function learnThrow(){
    if(L.busy)return;audio();
    if(L.step>=DEMO.length){L.step=0;L.seq=[];}
    const last=L.seq[L.seq.length-1];if(last&&!AGAIN.has(last))L.seq=[];
    const d=DEMO[L.step];
    L.busy=true;const st=d.f.slice();L.sticks=null;L.layout=null;renderLearn();
    L.layout=makeLayout($('lSticks'));await throwAnim($('lSticks'),st,L.layout);L.sticks=st;
    L.step++;announce(d.v);L.seq.push(d.v);L.busy=false;renderLearn();
  }
  $('lThrow').addEventListener('click',learnThrow);
  function showTab(){const learn=location.hash==='#learn';$('viewPlay').hidden=learn;$('viewLearn').hidden=!learn;$('tabPlay').setAttribute('aria-selected',String(!learn));$('tabLearn').setAttribute('aria-selected',String(learn));if(learn)renderLearn();else render();}
  $('tabPlay').addEventListener('click',()=>{location.hash='play';});
  $('tabLearn').addEventListener('click',()=>{location.hash='learn';});
  window.addEventListener('hashchange',showTab);
  
  /* ---------- start ---------- */
  function normalize(x){x.choose=null;x.stats=x.stats||{start:Date.now(),throws:{A:0,B:0}};x.kind=x.kind||{A:'stick-wood',B:'date'};x.busy=false;x.movingIds=[];x.hit=null;x.salia=false;x.quraFx=null;x.full=x.full||{A:false,B:false};x.log=(x.log||[]).filter(Array.isArray);if(x.phase==='place'&&!x.pool.length)x.phase='throw';return x;}
  function kick(){if(isAI()){if(S.phase==='throw')setTimeout(doThrow,1600);else if(S.phase==='place')setTimeout(aiPlace,900);}}
  function start(data){
    const hot=data&&data.pions&&data.qura;
    let saved=null;
    if(!hot){try{saved=JSON.parse(localStorage.getItem('syag-save')||'null')}catch(e){}if(!(saved&&saved.pions&&saved.qura&&saved.log&&!saved.winner))saved=null;}
    resumePending=!!saved;
    S=hot?normalize(data):fresh($('mode').value,+$('players').value);
    $('mode').value=S.mode;$('players').value=String(S.players);
    applyLang();showTab();
    if(saved){
      const cnt=x=>saved.pions.filter(p=>p.team===x&&p.alive).length;
      $('resumeInfo').textContent=T('resumeInfo',{t:TN(saved.turn),a:cnt('A'),A:TN('A'),b:cnt('B'),B:TN('B')});
      $('resume').hidden=false;
      $('resumeBtn').onclick=()=>{audio();S=normalize(saved);resumePending=false;$('resume').hidden=true;$('mode').value=S.mode;$('players').value=String(S.players);render();announceTurn();kick();};
      $('freshBtn').onclick=()=>{audio();resumePending=false;$('resume').hidden=true;newGame();kick();};
      return;
    }
    if(hot)kick();
  }
  window.claude?.hot?.snapshot?.(()=>JSON.parse(JSON.stringify(S)));
  window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();

</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});}
</script>
